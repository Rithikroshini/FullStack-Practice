<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Classified Web App</title>
</head>
<body>
    <header>
        <h1>Classified Web App</h1>
    </header>
    <main>
        <div class="create-ad">
            <h2>Create Ad</h2>
            <form id="adForm">
                <input type="text" id="adTitle" placeholder="Title is required" required>
                <textarea id="adDescription" placeholder="Description" required></textarea>
                <input type="text" id="adPrice" placeholder="Price" required>
                <button type="submit">Post Ad</button>
            </form>
        </div>
        <div class="ads" id="adsContainer">
            
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
